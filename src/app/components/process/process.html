<section id="process" class="bg-white py-24 sm:py-32">
  <div class="container">
    <div class="reveal mx-auto max-w-2xl text-center">
      <span class="text-xs font-bold uppercase tracking-widest text-accent-600">How It Works</span>
      <h2 class="mt-3 font-heading text-3xl font-bold text-navy-900 sm:text-4xl">Our Simple Process</h2>
      <p class="mt-4 text-navy-800/70">From booking to delivery, we keep every step transparent and effortless.</p>
    </div>

    <div class="relative mt-16 grid gap-10 lg:grid-cols-4">
      <div class="absolute left-0 right-0 top-8 hidden h-0.5 bg-navy-900/10 lg:block"></div>
      @for (step of process; track step.title; let i = $index) {
        <div
          class="reveal relative text-center"
          [class.reveal-delay-1]="i === 1"
          [class.reveal-delay-2]="i === 2"
          [class.reveal-delay-3]="i === 3"
        >
          <div class="relative mx-auto grid h-16 w-16 place-items-center rounded-full bg-navy-gradient text-white shadow-soft">
            <app-icon [name]="step.icon" class="h-7 w-7" />
            <span class="absolute -right-2 -top-2 grid h-7 w-7 place-items-center rounded-full bg-accent-gradient text-xs font-bold text-navy-950">
              {{ step.number }}
            </span>
          </div>
          <h3 class="mt-5 font-heading text-lg font-semibold text-navy-900">{{ step.title }}</h3>
          <p class="mt-2 text-sm text-navy-800/70">{{ step.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
