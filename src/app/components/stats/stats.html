<section id="stats-section" class="bg-slate-50 py-20">
  <div class="container">
    <div class="reveal mx-auto mb-12 max-w-2xl text-center">
      <span class="text-xs font-bold uppercase tracking-widest text-accent-600">By The Numbers</span>
      <h2 class="mt-3 font-heading text-3xl font-bold text-navy-900 sm:text-4xl">
        We Are a Professional Transportation Company
      </h2>
    </div>
    <div class="grid grid-cols-2 gap-8 rounded-3xl bg-white p-10 shadow-card sm:grid-cols-4">
      @for (stat of stats; track stat.label) {
        <div class="reveal text-center">
          <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-navy-gradient text-white">
            <app-icon [name]="stat.icon" class="h-7 w-7" />
          </span>
          <p class="mt-4 font-heading text-3xl font-bold text-navy-900">{{ formatStat(stat) }}</p>
          <p class="mt-1 text-sm text-navy-800/60">{{ stat.label }}</p>
        </div>
      }
    </div>
  </div>
</section>
