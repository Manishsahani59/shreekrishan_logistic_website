<section class="bg-white py-24 sm:py-32">
  <div class="container grid gap-12 lg:grid-cols-12">
    <div class="reveal lg:col-span-4">
      <span class="text-xs font-bold uppercase tracking-widest text-accent-600">FAQ</span>
      <h2 class="mt-3 font-heading text-3xl font-bold text-navy-900 sm:text-4xl">Frequently Asked Questions</h2>
      <p class="mt-4 text-navy-800/70">
        Can't find the answer you're looking for? Reach out to our team directly.
      </p>
      <button type="button" (click)="scrollToContactForm()" class="mt-6 inline-flex items-center gap-2 text-sm font-semibold text-accent-600">
        Contact Support <app-icon name="arrow-right" class="h-4 w-4" />
      </button>
    </div>

    <div class="reveal lg:col-span-8">
      <div class="divide-y divide-navy-900/10 rounded-2xl border border-navy-900/10">
        @for (faq of faqs; track faq.question; let i = $index) {
          <div>
            <button
              type="button"
              (click)="toggleFaq(i)"
              class="flex w-full items-center justify-between gap-4 px-6 py-5 text-left"
            >
              <span class="font-heading font-semibold text-navy-900">{{ faq.question }}</span>
              <span
                class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-navy-900/5 text-navy-700 transition-transform duration-300"
                [class.rotate-45]="faq.open"
              >
                <app-icon name="bolt" class="h-4 w-4 rotate-90" />
              </span>
            </button>
            <div class="accordion-panel" [class.open]="faq.open">
              <div>
                <p class="px-6 pb-5 text-sm text-navy-800/70">{{ faq.answer }}</p>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
