<section id="gallery" class="bg-slate-50 py-24 sm:py-32">
  <div class="container">
    <div class="reveal mx-auto max-w-2xl text-center">
      <span class="text-xs font-bold uppercase tracking-widest text-accent-600">Gallery</span>
      <h2 class="mt-3 font-heading text-3xl font-bold text-navy-900 sm:text-4xl">Life in the Field</h2>
    </div>

    <div class="mt-16 grid auto-rows-[220px] grid-cols-2 gap-4 lg:grid-cols-4">
      @for (item of gallery; track item.title; let i = $index) {
        <div
          class="reveal group relative overflow-hidden rounded-2xl shadow-card"
          [class]="item.span"
          [class.reveal-delay-1]="i % 4 === 1"
          [class.reveal-delay-2]="i % 4 === 2"
          [class.reveal-delay-3]="i % 4 === 3"
        >
          <img
            [src]="item.image"
            [alt]="item.title"
            class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110"
          />
          <div class="absolute inset-0 flex flex-col justify-end bg-gradient-to-t from-navy-950/85 via-navy-950/0 to-transparent p-4 opacity-0 transition-opacity duration-300 group-hover:opacity-100">
            <span class="text-xs font-semibold uppercase tracking-wide text-accent-400">{{ item.tag }}</span>
            <p class="font-heading text-sm font-semibold text-white">{{ item.title }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
