<section
  class="bg-navy-gradient py-24 sm:py-32"
  (mouseenter)="pauseAutoplay()"
  (mouseleave)="resumeAutoplay()"
>
  <div class="container">
    <div class="reveal mx-auto max-w-2xl text-center">
      <span class="text-xs font-bold uppercase tracking-widest text-accent-400">Testimonials</span>
      <h2 class="mt-3 font-heading text-3xl font-bold text-white sm:text-4xl">What Our Clients Say</h2>
    </div>

    <div class="relative mx-auto mt-16 max-w-2xl">
      <div class="overflow-hidden">
        <div
          class="flex transition-transform duration-500 ease-out"
          [style.transform]="'translateX(-' + activeIndex * 100 + '%)'"
        >
          @for (t of testimonials; track t.company) {
            <div class="w-full shrink-0 px-1">
              <div class="glass relative flex min-h-[260px] flex-col rounded-2xl p-8 text-center sm:p-10">
                <app-icon name="quote" class="mx-auto h-8 w-8 text-accent-400/60" />
                <p class="mt-4 flex-1 text-base text-white/80 sm:text-lg">{{ t.quote }}</p>
                <div class="mt-6 flex items-center justify-center gap-3 border-t border-white/10 pt-5">
                  <span class="grid h-16 w-16 shrink-0 place-items-center rounded-xl bg-white p-1">
                    <img [src]="'clients/' + t.logo + '.png'" [alt]="t.company" class="h-full w-full object-contain" />
                  </span>
                  <p class="font-heading text-sm font-semibold text-white">{{ t.company }}</p>
                </div>
              </div>
            </div>
          }
        </div>
      </div>

      <button
        type="button"
        (click)="prev()"
        aria-label="Previous testimonial"
        class="absolute left-0 top-1/2 -translate-x-4 -translate-y-1/2 grid h-10 w-10 place-items-center rounded-full bg-white/10 text-white backdrop-blur transition-colors hover:bg-white/20 sm:-translate-x-14"
      >
        <app-icon name="arrow-right" class="h-4 w-4 rotate-180" />
      </button>
      <button
        type="button"
        (click)="next()"
        aria-label="Next testimonial"
        class="absolute right-0 top-1/2 translate-x-4 -translate-y-1/2 grid h-10 w-10 place-items-center rounded-full bg-white/10 text-white backdrop-blur transition-colors hover:bg-white/20 sm:translate-x-14"
      >
        <app-icon name="arrow-right" class="h-4 w-4" />
      </button>

      <div class="mt-8 flex justify-center gap-2">
        @for (t of testimonials; track t.company; let i = $index) {
          <button
            type="button"
            (click)="goTo(i)"
            [attr.aria-label]="'Go to testimonial ' + (i + 1)"
            class="h-2 rounded-full transition-all"
            [class.w-6]="i === activeIndex"
            [class.bg-accent-400]="i === activeIndex"
            [class.w-2]="i !== activeIndex"
            [class.bg-white/25]="i !== activeIndex"
          ></button>
        }
      </div>
    </div>
  </div>
</section>
