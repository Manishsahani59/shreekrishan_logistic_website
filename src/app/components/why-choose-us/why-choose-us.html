<section class="relative overflow-hidden bg-navy-gradient py-24 sm:py-32">
  <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 20% 20%, white 1px, transparent 1px); background-size: 32px 32px;"></div>
  <div class="container relative">
    <div class="reveal mx-auto max-w-2xl text-center">
      <span class="text-xs font-bold uppercase tracking-widest text-accent-400">Why Shri Krishna Logistics</span>
      <h2 class="mt-3 font-heading text-3xl font-bold text-white sm:text-4xl">Why Choose Us</h2>
      <p class="mt-4 text-white/70">
        We combine global reach with local expertise to deliver a logistics experience you can rely on.
      </p>
    </div>

    <div class="mt-16 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (feature of features; track feature.title; let i = $index) {
        <div
          class="reveal glass rounded-2xl p-7 transition-transform duration-300 hover:-translate-y-1"
          [class.reveal-delay-1]="i % 3 === 1"
          [class.reveal-delay-2]="i % 3 === 2"
        >
          <span class="grid h-12 w-12 place-items-center rounded-xl bg-accent-gradient text-navy-950">
            <app-icon [name]="feature.icon" class="h-6 w-6" />
          </span>
          <h3 class="mt-5 font-heading text-lg font-semibold text-white">{{ feature.title }}</h3>
          <p class="mt-2 text-sm text-white/65">{{ feature.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
